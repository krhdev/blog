
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — KRHDev Tech Blog</title>
    <link rel="icon" type="image/png" href="./assets/krhdev.png">
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
    <header class="site-header">
        <img src="./assets/krhdev.png" alt="Tech Blog Logo">
        <h1>KRHDev Tech Blog</h1>
    </header>

    <div class="container" id="reset-card" style="max-width: 420px; margin: 40px auto;">
        <h2>Reset Your Password</h2>
        <p id="reset-status" style="display:none; color: var(--text-muted); font-size: 0.9rem;"></p>
        <input type="password" id="new-password" placeholder="New password (min. 8 characters)">
        <button onclick="submitReset()">Set New Password</button>
    </div>

    <script>
        function getTokenFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get("token");
        }

        function submitReset() {
            const token = getTokenFromUrl();
            const newPassword = document.getElementById("new-password").value;
            const statusEl = document.getElementById("reset-status");

            if (!token) {
                statusEl.textContent = "No reset token found in this link.";
                statusEl.style.display = "block";
                return;
            }

            fetch("/api/users/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, newPassword }),
            })
                .then((res) => res.json())
                .then((data) => {
                    statusEl.textContent = data.message;
                    statusEl.style.display = "block";
                    if (data.message && data.message.includes("updated")) {
                        document.getElementById("new-password").style.display = "none";
                        document.querySelector("button").style.display = "none";
                    }
                })
                .catch(() => {
                    statusEl.textContent = "Something went wrong. Please try again.";
                    statusEl.style.display = "block";
                });
        }
    </script>
</body>

</html>
